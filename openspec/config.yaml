schema: spec-driven

context: |
  Kivy/python-for-android client for the rns-portfwd protocol. The forwarding
  engine lives in `app/portfwd_android/`; the protocol is an unmodified vendor
  copy in `app/rns_portfwd/` (never edit it, re-vendor from upstream).
  Android API 33 target, min API 24, arm64-v8a, Reticulum shared instance on
  127.0.0.1:37428. Listeners are loopback only (127.0.0.1 + [::1]); ports
  1..1023 are rejected. Secrets live in profiles.json (0600) and are redacted
  from logs. All UI strings go through `portfwd_android.i18n.t()` with the
  master catalog in `app/assets/i18n/translations.json` plus `es.json`.
  Unit tests must not initialize RNS.Reticulum; integration tests use
  `tests/integration/harness.py` with a private rnsd and the headless engine.

rules:
  proposal:
    - Keep proposals under 600 words
    - Always include a Non-goals section
